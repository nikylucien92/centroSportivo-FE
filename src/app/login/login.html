<div class="login-form" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h3 class="titolo">Accedi</h3>
      </div>

      <form class="needs-validation" #formLogin="ngForm" (ngSubmit)="accedi()">

        <div class="modal-body">

          @if (msgError()) {
            <div
              class="error-message"
              role="alert"
              aria-live="assertive">
              <span class="error-icon">
              <i class="bi bi-exclamation-circle-fill">i</i>
            </span>
            <span class="error-text">{{ msgError() }}</span>
              
            </div>
          }

          <div class="mb-3">
            <label for="email" class="form-label">
              Email *
            </label>

            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              placeholder="Inserisci email"
              [(ngModel)]="userLogin.email"
              #inputEmail="ngModel"
            />

            @if (inputEmail.touched && !validaEmail()) {
              <div class="text-danger mt-1">
                Inserisci un formato email valido,
                es. esempio@dominio.com
              </div>
            }
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">
              Password *
            </label>

            <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              placeholder="Inserisci password"
              [(ngModel)]="userLogin.password"
              #inputPassword="ngModel"
            />

            @if (inputPassword.touched && !validaPassword()) {
              <div class="text-danger mt-1">
                La password deve contenere almeno 6 caratteri.
              </div>
            }
          </div>

        </div>

        <div class="modal-footer">

          <button
            type="submit"
            class="btn-login"
            [disabled]="loading() || !validaLogin()"
            >

            @if (loading()) {
              Accesso in corso...
            } @else {
              Accedi
            }

          </button>

          <button
            type="button"
            class="btn btn-link"
            (click)="apriRegistrazione()">
            Non hai un account? Registrati
          </button>

        </div>

      </form>

    </div>
  </div>
</div>
