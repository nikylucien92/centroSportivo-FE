<div class="modal fade show" tabindex="-1" aria-hidden="false" style="display: block">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
    
      <div class="modal-header">
        <h1 class="modal-title fs-5">Accedi</h1>

        <button type="button" class="btn-close" aria-label="Close" (click)="chiudiLogin()"></button>
      </div>

  
      <div class="modal-body">
        <form>
   
          <div class="mb-3">
            <label for="email" class="form-label"> Email </label>

            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              placeholder="Inserisci email"
              [(ngModel)]="userLogin.email"
              required
            />
          </div>

          <div class="mb-3">
            <label for="password" class="form-label"> Password </label>

            <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              placeholder="Inserisci password"
              [(ngModel)]="userLogin.password"
              required
            />
          </div>
        </form>
      </div>


      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="chiudiLogin()">Chiudi</button>

        <button type="button" class="btn btn-primary" (click)="accedi()">Accedi</button>

        <button type="button" class="btn btn-link" (click)="apriRegistrazione()">
          Non hai un account? Registrati
        </button>
      </div>
    </div>
  </div>
</div>
