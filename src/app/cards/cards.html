      <!-- CALCIO                -->

      <div class="sport-card"
 >

        <div class="sport-icon" >

          <svg viewBox="0 0 100 100">

            <!-- cerchio esterno -->

              cy="50"
              r="34"

              cx="50"
              cy="50"
              r="18"

            />

            <polygon
              points="50,42 58,47 55,57 45,57 42,47"

            />

            <!-- dettagli pallone -->
