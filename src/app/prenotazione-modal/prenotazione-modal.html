<div class="modal fade show d-block" tabindex="-1" aria-hidden="false">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <!-- HEADER -->
      <h1 class="modal-title">{{ sport }}</h1>
      <div class="d-flex justify-content-end">
        <button type="button" class="btn-close" (click)="chiudiModal()"></button>
      </div>
      <!-- BODY -->

      <div class="modal-body">
        @if (messaggioErrore) {
          <div class="alert alert-danger" role="alert">
            {{ messaggioErrore }}
          </div>
        }

        @if (campo) {
          <p class="mb-3">
            <strong>{{ campo.nome }}</strong> — {{ campo.prezzo | number: '1.2-2' }} € / ora
          </p>
        }

        <form class="needs-validation" #prenotazioneForm="ngForm" (ngSubmit)="prenota()">
          <!-- DATA -->

          <div class="mb-3">
            <label class="form-label"> Data* </label>

            <input
              type="date"
              class="form-control"
              name="dataSelezionata"
              [(ngModel)]="dataSelezionata"
              (ngModelChange)="onCambioData()"
              [min]="dataMinima"
            />
          </div>

          <!-- ORARIO DISPONIBILE -->

          <div class="mb-3">
            <label class="form-label"> Orario disponibile* </label>

            <select
              class="form-select"
              name="disponibilitaCampoId"
              [(ngModel)]="disponibilitaCampoId"
              [disabled]="caricamento || slotDisponibili.length === 0"
            >
              <option [ngValue]="null" disabled>
                @if (caricamento) {
                  Caricamento in corso...
                } @else if (slotDisponibili.length === 0) {
                  Nessun orario disponibile in questa data
                } @else {
                  Seleziona un orario
                }
              </option>

              @for (slot of slotDisponibili; track slot.id) {
                <option [ngValue]="slot.id">
                  {{ formattaOrario(slot) }}
                </option>
              }
            </select>
          </div>

          <!-- NUMERO GIOCATORI -->

          <div class="mb-3">
            <label class="form-label"> Numero giocatori* </label>

            <input
              type="number"
              class="form-control"
              name="numeroGiocatori"
              min="1"
              [(ngModel)]="numeroGiocatori"
              (ngModelChange)="calcoloPrezzoPersona()"
            />
          </div>

          <div class="mb-3">
            <label class="form-label"> Costo totale </label>

            <input
              type="text"
              class="form-control"
              [value]="(costoTotale | number: '1.2-2') + ' €'"
              readonly
            />
          </div>

          <!-- COSTO PERSONA -->

          <div class="mb">
            <label class="form-label"> Costo per persona </label>

            <input
              type="text"
              class="form-control"
              [value]="(costoPersona | number: '1.2-2') + ' €'"
              readonly
            />
          </div>
          <!-- FOOTER -->

          <div class="d-grid gap-2 mt-3">
            <button
              type="submit"
              class="btn btn-primary w-100"
              [disabled]="invioInCorso || disponibilitaCampoId === null"
            >
              @if (invioInCorso) {
                Prenotazione in corso...
              } @else {
                Prenota
              }
            </button>

            <button type="button" class="btn btn-danger w-100 mt-2" (click)="chiudiModal()">
              Chiudi
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
