<div
  class="modal fade show"
  tabindex="-1"
  aria-hidden="false"
  style="display: block"
>

  <div class="modal-dialog modal-dialog-centered">

    <div class="modal-content">


      <!-- HEADER -->

      <div class="modal-header">

        <h1 class="modal-title fs-5">

          Prenota {{ sport }}

        </h1>

        <button
          type="button"
          class="btn-close"
          (click)="chiudiModal()"
        ></button>

      </div>


      <!-- BODY -->

      <div class="modal-body">

        @if (messaggioErrore) {
          <div class="alert alert-danger" role="alert">
            {{ messaggioErrore }}
          </div>
        }

        @if (campo) {
          <p class="mb-3">
            <strong>{{ campo.nome }}</strong> — {{ campo.prezzo | number:'1.2-2' }} € / ora
          </p>
        }

        <form #prenotazioneForm="ngForm">

          <!-- DATA -->

          <div class="mb-3">

            <label class="form-label">
              Data
            </label>

            <input
              type="date"
              class="form-control"
              name="dataSelezionata"
              [(ngModel)]="dataSelezionata"
              (ngModelChange)="onCambioData()"
            />

          </div>


          <!-- ORARIO DISPONIBILE -->

          <div class="mb-3">

            <label class="form-label">
              Orario disponibile
            </label>

            <select
              class="form-select"
              name="disponibilitaCampoId"
              [(ngModel)]="disponibilitaCampoId"
              [disabled]="caricamento || slotDisponibili.length === 0"
            >
              <option [ngValue]="null" disabled>
                @if (caricamento) {
                  Caricamento in corso...
                } @else if (slotDisponibili.length === 0) {
                  Nessun orario disponibile in questa data
                } @else {
                  Seleziona un orario
                }
              </option>

              @for (slot of slotDisponibili; track slot.id) {
                <option [ngValue]="slot.id">
                  {{ formattaOrario(slot) }}
                </option>
              }
            </select>

          </div>


          <!-- NUMERO GIOCATORI -->

          <div class="mb-3">

            <label class="form-label">
              Numero giocatori
            </label>

            <input
              type="number"
              class="form-control"
              name="numeroGiocatori"
              min="1"
              [(ngModel)]="numeroGiocatori"
              (ngModelChange)="calcoloPrezzoPersona()"
            />

          </div>


          <!-- COSTO TOTALE (di sola lettura: deriva dal prezzo del campo) -->

          <div class="mb-3">

            <label class="form-label">
              Costo totale
            </label>

            <input
              type="text"
              class="form-control"
              [value]="(costoTotale | number:'1.2-2') + ' €'"
              readonly
            />

          </div>


          <!-- COSTO PERSONA -->

          <div class="mb-3">

            <label class="form-label">
              Costo per persona
            </label>

            <input
              type="text"
              class="form-control"
              [value]="(costoPersona | number:'1.2-2') + ' €'"
              readonly
            />

          </div>

        </form>

      </div>


      <!-- FOOTER -->

      <div class="modal-footer">

        <button
          type="button"
          class="btn btn-secondary"
          (click)="chiudiModal()"
        >

          Chiudi

        </button>


        <button
          type="button"
          class="btn btn-primary"
          [disabled]="invioInCorso || disponibilitaCampoId === null"
          (click)="prenota()"
        >

          @if (invioInCorso) {
            Prenotazione in corso...
          } @else {
            Prenota
          }

        </button>

      </div>

    </div>

  </div>

</div>
