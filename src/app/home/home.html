<section class="hero">

  @if (!autenticato) {

    <!-- SFONDO / TESTO -->
    <div class="hero-content">

      <h1>
        Trova il campo.<br />
        Prenota. Gioca.<br />
        <span>Connettiti.</span>
      </h1>

    </div>


    <div class="auth-backdrop"></div>


    <div class="auth-page">

      <div class="auth-container">

        @if (schermataAuth === 'login') {

          <app-login
            (loginSuccess)="loginCompletato()"
            (registrazione)="apriRegistrazione()">
          </app-login>

        }

        @if (schermataAuth === 'registrazione') {

          <app-registrazione
            (register)="registrazioneCompletata()"
            (chiudi)="chiudiRegistrazione()"
            >
            
          </app-registrazione>

        }

      </div>

    </div>

  }

  
    @if (autenticato) {

    <!-- APPLICAZIONE PRINCIPALE -->

    <div class="container">

      <div class="row">

        <div class="col-12" id="app-navbar">
          <app-navbar></app-navbar>
        </div>

      </div>
      

      <div class="row">

        <div class="col-12" id="app-carousel">

          <app-carousel-match></app-carousel-match>
        </div>

      </div>


      <div class="row">

        <div class="col-12" id="app-cards">
          <app-cards></app-cards>
        </div>

      </div>

    </div>

  }

</section>


@if (mostraToasts()) {

  <div
    class="position-fixed bottom-0 end-0 p-3"
    style="z-index: 99999;"
  >

    <div
      class="toast show"
      role="alert"
      aria-live="assertive"
      aria-atomic="true"
    >

      <div class="toast-header">

        
        <strong class="me-auto">
          {{ toastsTitolo() }}
        </strong>

        <button
          type="button"
          class="btn-close"
          aria-label="Close"
          (click)="chiudiToast()">
        </button>

      </div>

      <div class="toast-body">
        {{ toastsMessaggio() }}
      </div>

    </div>

  </div>

}
